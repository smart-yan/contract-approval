# Alembic configuration (architecture doc: section 2.1, section 17 / P2 deliverable).
#
# !!! THIS FILE MUST STAY PURE ASCII !!!
#
# Python's configparser reads this file using the *locale* default encoding.
# On a Chinese Windows machine that is GBK, so any non-ASCII byte here raises
# UnicodeDecodeError and Alembic fails to start at all. Alembic offers no way to
# force an encoding for the ini file, so all explanatory text lives in
# migrations/env.py (a .py file, always read as UTF-8) instead.
#
# NOTE: sqlalchemy.url is intentionally absent here.
# The DSN has exactly one source: .env, read through app.core.config.Settings
# and injected by migrations/env.py. Two reasons:
#   1. the password should exist in one place only;
#   2. a mismatch between ini and .env would silently migrate the WRONG database.
# Responsibilities are therefore explicit:
#   runtime (application) -> app/db/session.py -> mysql+aiomysql, pooled, async
#   migration online      -> migrations/env.py -> mysql+aiomysql, NullPool, async
#   migration offline     -> migrations/env.py -> mysql+pymysql, SQL text only

[alembic]
script_location = migrations

# Let the `alembic` command import the `app` package when run from backend/
prepend_sys_path = .

# Use the OS path separator for version locations (portable across platforms)
version_path_separator = os

# Migration filename template: datetime prefix keeps the directory ordered
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used by file_template only
timezone = UTC


[post_write_hooks]
# Reserved: hook ruff formatting of newly generated revisions here


# --------------------------------------------------------------------------- #
# Logging configuration. Deliberately independent from app.core.logging:
# migrations run as a separate short-lived process, not inside the app.
# --------------------------------------------------------------------------- #
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
